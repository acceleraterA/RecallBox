name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: recallbox
          POSTGRES_USER: recallbox
          POSTGRES_PASSWORD: recallbox
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U recallbox -d recallbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://recallbox:recallbox@localhost:5433/recallbox
      FRONTEND_ORIGIN: http://localhost:3000,http://127.0.0.1:3000
      DEFAULT_USER_EMAIL: demo@recallbox.local
      ENABLE_AUTH: "false"
      ENABLE_LLM: "false"
      ENABLE_EMBEDDINGS: "false"
      EMBEDDING_PROVIDER: huggingface
      HUGGINGFACE_EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      RAG_MIN_SIMILARITY: "0.55"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m compileall app
      - run: python -c 'import app.main; import app.backfill_embeddings; import app.backfill_rag; print("backend imports ok")'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render production backend
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping Render production deploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"

      - name: Trigger Vercel production frontend
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set; skipping Vercel production deploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"

  deploy-v2-preview:
    name: Deploy V2 Preview
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v2-rag'
    steps:
      - name: Trigger Render v2 backend
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_V2_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "RENDER_V2_DEPLOY_HOOK_URL is not set; skipping Render v2 deploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"

      - name: Trigger Vercel v2 frontend
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_V2_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_V2_DEPLOY_HOOK_URL is not set; skipping Vercel v2 deploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL"

